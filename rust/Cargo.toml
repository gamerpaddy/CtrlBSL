[package]
name = "dbk2jp"
version = "1.0.0"
edition = "2021"
description = "Drive a BSL/SeaCAD DBK2JP galvo laser controller over USB, with no vendor software"
license = "WTFPL"
repository = "https://github.com/gamerpaddy/CtrlBSL"

[lib]
name = "dbk2jp_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Build the Python extension module. Off by default so the core crate stays
# dependency-free and builds anywhere.
python = ["dep:pyo3"]
# Linux/macOS transport. Windows needs nothing: it talks to CYUSB3 through
# DeviceIoControl, declared inline.
libusb = ["dep:rusb"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }

[target.'cfg(unix)'.dependencies]
rusb = { version = "0.9", optional = true }

[profile.release]
opt-level = 3
lto = true
